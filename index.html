<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a23">
<title>ИИ-чаты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#0f1117; --p1:#171a23; --p2:#1f2330; --line:#2b3040;
  --tx:#eceef4; --mu:#8b93a7; --ac:#ff8a4c;
  --ai:#1f2330; --me:linear-gradient(135deg,#ff8a4c,#f0623a);
}
@media(prefers-color-scheme:light) {
  :root {
    color-scheme:light;
    --bg:#f4f1ec; --p1:#fffdf9; --p2:#f0ebe3; --line:#e2dacd;
    --tx:#26221c; --mu:#7d7466; --ai:#fff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.app{display:flex;height:100dvh;padding-top:env(safe-area-inset-top)}
.side{width:300px;flex:none;background:var(--p1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;padding:0 6px}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--me);display:grid;place-items:center;color:#fff;font-style:normal}
.new{padding:12px;border-radius:14px;background:var(--me);color:#fff;font-weight:700}
.search,.field input{height:44px;width:100%;border:1px solid var(--line);border-radius:13px;background:var(--p2);padding:0 12px;outline:0}
.search:focus,.field input:focus{border-color:var(--ac)}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:14px;cursor:pointer}
.row:hover,.row.on{background:var(--p2)}
.row.on{border-color:var(--ac)}
.av{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:800}
.inf{flex:1;min-width:0}
.inf b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.inf small{color:var(--mu);font-size:12px}
.x{color:var(--mu);font-size:20px;padding:2px 8px}
.x:hover{color:#ff5d5d}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--p1)}
.top .inf b{font-size:16px}
.ico{width:40px;height:40px;flex:none;border-radius:12px;background:var(--p2);font-size:18px}
.menu{display:none}
.msgs{flex:1;min-height:0;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--mu);max-width:300px}
.empty big{display:block;font-size:46px}
.m{position:relative;max-width:min(720px,90%);padding:11px 14px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap}
.m.user{align-self:flex-end;color:#fff;background:var(--me);border-bottom-right-radius:5px}
.m.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:5px}
.m.err{border-color:#ff5d5d;color:#ff8b8b}
.m pre{overflow:auto;background:#0b0d12;color:#eee;padding:12px;border-radius:10px;white-space:pre}
.m code{font:13px ui-monospace,monospace;background:#8883;padding:2px 4px;border-radius:5px}
.m pre code{background:none}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:#fff2}
.copy{display:block;margin-top:8px;color:var(--mu);font-size:11px}
.typing{padding:0 18px 8px;color:var(--mu)}
.comp{padding:10px 12px max(10px,env(safe-area-inset-bottom));background:var(--p1);border-top:1px solid var(--line)}
.prev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pv{display:flex;align-items:center;gap:6px;max-width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:10px;background:var(--p2);font-size:12px}
.pv span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.box{display:flex;align-items:flex-end;gap:7px;padding:6px;border:1px solid var(--line);border-radius:20px;background:var(--p2)}
.box:focus-within{border-color:var(--ac)}
textarea{flex:1;min-width:0;min-height:40px;max-height:140px;resize:none;border:0;outline:0;background:none;padding:9px 6px;font-size:16px}
.send{width:40px;height:40px;border-radius:14px;background:var(--me);color:white;font-size:18px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#000a}
.card{width:min(100%,430px);max-height:90dvh;overflow:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--p1)}
.card h2{margin:0 0 5px}
.card p{margin:0 0 15px;color:var(--mu);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--mu);font-weight:700}
.field input{font-size:16px}
.error{min-height:18px;color:#ff6b6b;font-size:13px}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{flex:1;height:46px;border-radius:13px;background:var(--p2);font-weight:700}
.actions .ok{background:var(--me);color:white}
@media(max-width:760px){
 .side{position:fixed;z-index:40;inset:0 auto 0 0;width:min(84%,320px);transform:translateX(-100%);transition:transform .2s;padding-top:max(16px,env(safe-area-inset-top))}
 .side.open{transform:translateX(0);box-shadow:0 0 0 100vmax #0008}
 .menu{display:block}
 .m{max-width:94%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>✦</i>ИИ-чаты</div>
    <button class="new" id="addBtn" type="button">＋ Новый чат</button>
    <input class="search" id="search" type="search" placeholder="Поиск по чатам…" aria-label="Поиск по чатам">
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="ico menu" id="menuBtn" type="button" aria-label="Открыть чаты">☰</button>
      <div class="av" id="topAv">✦</div>
      <div class="inf"><b id="title">Выбери чат</b><small id="sub">Добавь модель, чтобы начать</small></div>
      <button class="ico" id="clearBtn" type="button" title="Очистить переписку" aria-label="Очистить переписку">🗑</button>
    </header>

    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="typing hidden" id="typing">ИИ готовит ответ…</div>

    <footer class="comp">
      <div class="prev" id="prev"></div>
      <div class="box">
        <button class="ico" id="attach" type="button" aria-label="Прикрепить файл">📎</button>
        <input id="file" type="file" multiple accept="image/*,.txt,.md,.csv,.json,.log,.xml,.html,.css,.js,.py,.yaml,.yml" hidden>
        <textarea id="inp" rows="1" placeholder="Напиши сообщение…" aria-label="Сообщение"></textarea>
        <button class="send" id="send" type="button" aria-label="Отправить">➤</button>
      </div>
    </footer>
  </main>
</div>

<div class="modal hidden" id="modal">
  <form class="card" id="form">
    <h2>Новый чат с ИИ</h2>
    <p>Укажи модель, API-ключ и адрес совместимого API.</p>
    <div class="field">
      <label for="mName">Название модели</label>
      <input id="mName" placeholder="например, gpt-4o" autocomplete="off" required>
    </div>
    <div class="field">
      <label for="mKey">API-ключ</label>
      <input id="mKey" type="password" placeholder="API-ключ" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="mUrl">Адрес API</label>
      <input id="mUrl" type="url" value="https://darkapi.shop" required>
    </div>
    <div class="error" id="formError" role="alert"></div>
    <div class="actions">
      <button id="cancel" type="button">Отмена</button>
      <button class="ok" type="submit">Добавить</button>
    </div>
  </form>
</div>

<script>
"use strict";

// Адрес вашего Cloudflare Worker.
const PROXY = "https://ai-proxy.8o8o99oooooo.workers.dev/";

// Если используете backend вместо Worker, укажите его адрес.
// При пустом значении запрос идёт через PROXY.
const BACKEND = "";

const DEFAULT_URL = "https://darkapi.shop";
const STORAGE_KEY = "telegram_ai_chat_manager_v2";
const MAX_FILES = 5;
const MAX_FILE_SIZE = 15 * 1024 * 1024;
const MAX_FILE_TEXT = 20000;

const tg = window.Telegram?.WebApp;
try {
  tg?.ready();
  tg?.expand();
} catch (_) {}

const $ = id => document.getElementById(id);
let chats = [];
let activeId = null;
let pending = [];
let busy = false;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({chats, activeId}));
  } catch (error) {
    console.warn("Не удалось сохранить историю:", error);
  }
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!saved || !Array.isArray(saved.chats)) return;

    chats = saved.chats
      .filter(chat => chat && chat.id && chat.name)
      .map(chat => ({
        id: String(chat.id),
        name: String(chat.name),
        key: String(chat.key || ""),
        url: String(chat.url || DEFAULT_URL),
        messages: Array.isArray(chat.messages) ? chat.messages : []
      }));

    activeId = chats.some(chat => chat.id === saved.activeId)
      ? saved.activeId
      : chats[0]?.id || null;
  } catch (error) {
    chats = [];
    activeId = null;
  }
}

const active = () => chats.find(chat => chat.id === activeId) || null;

const BRANDS = [
  ["claude","✳","#f6e1d3","#b4532a","Claude"],
  ["deepseek","🐋","#dbeaff","#1a63c4","DeepSeek"],
  ["gemini","✦","#e6e1ff","#5d49c9","Gemini"],
  ["grok","𝕏","#e4e8ee","#1d2732","Grok"],
  ["gpt","◎","#d9f5ea","#087a63","ChatGPT"],
  ["openai","◎","#d9f5ea","#087a63","OpenAI"]
];

function brand(name) {
  const lower = String(name || "").toLowerCase();
  const found = BRANDS.find(item => lower.includes(item[0]));
  return found
    ? {text:found[1], bg:found[2], fg:found[3], name:found[4]}
    : {text:String(name || "ИИ").slice(0,2).toUpperCase(), bg:"#ffe3d2", fg:"#b4532a", name:name || "ИИ"};
}

function paintAvatar(element, name) {
  const model = brand(name);
  element.textContent = model.text;
  element.style.background = model.bg;
  element.style.color = model.fg;
  element.title = model.name;
}

function renderList() {
  const list = $("list");
  const query = $("search").value.trim().toLowerCase();
  list.replaceChildren();

  const filtered = chats.filter(chat => chat.name.toLowerCase().includes(query));

  if (!filtered.length && query) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Чаты не найдены";
    list.append(empty);
    return;
  }

  filtered.forEach(chat => {
    const row = document.createElement("div");
    row.className = "row" + (chat.id === activeId ? " on" : "");

    const avatar = document.createElement("div");
    avatar.className = "av";
    paintAvatar(avatar, chat.name);

    const info = document.createElement("div");
    info.className = "inf";

    const title = document.createElement("b");
    title.textContent = chat.name;

    const subtitle = document.createElement("small");
    subtitle.textContent = brand(chat.name).name + " · " + chat.messages.length + " сообщ.";

    info.append(title, subtitle);

    const remove = document.createElement("button");
    remove.className = "x";
    remove.type = "button";
    remove.textContent = "×";
    remove.title = "Удалить чат";
    remove.setAttribute("aria-label", "Удалить чат " + chat.name);
    remove.onclick = event => {
      event.stopPropagation();
      deleteChat(chat.id);
    };

    row.append(avatar, info, remove);
    row.onclick = () => {
      selectChat(chat.id);
      $("side").classList.remove("open");
    };

    list.append(row);
  });
}

function escapeHTML(text) {
  return String(text).replace(/[&<>]/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;"
  })[char]);
}

function renderMarkdown(text) {
  return String(text).split(/
/).map((part, index) => {
    if (index % 2) {
      return "<pre><code>" +
        escapeHTML(part.replace(/^[\w+-]*\n/, "").replace(/\n$/, "")) +
        "</code></pre>";
    }

    return escapeHTML(part)
      .replace(/([^\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}

function renderMessages() {
  const container = $("msgs");
  const chat = active();
  container.replaceChildren();

  if (!chat || !chat.messages.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = chat
      ? "<big>💬</big><b>Начни общение</b><br>Напиши сообщение или прикрепи файл."
      : "<big>✦</big><b>Пока нет чатов</b><br>Нажми «Новый чат», чтобы добавить модель.";
    container.append(empty);
    return;
  }

  chat.messages.forEach(message => {
    const bubble = document.createElement("div");
    bubble.className = "m " + (message.who === "user" ? "user" : "ai") +
      (message.err ? " err" : "");

    if (message.who === "ai") {
      bubble.innerHTML = renderMarkdown(message.text || "");
    } else {
      bubble.textContent = message.text || "";
    }

    if (Array.isArray(message.files) && message.files.length) {
      const tags = document.createElement("div");
      tags.className = "tags";

      message.files.forEach(file => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = (file.type?.startsWith("image/") ? "🖼 " : "📎 ") + file.name;
        tags.append(tag);
      });

      bubble.append(tags);
    }

    if (message.who === "ai" && !message.err) {
      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy";
      copy.textContent = "Копировать";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(message.text || "");
          copy.textContent = "Скопировано ✓";
        } catch (_) {
          copy.textContent = "Не удалось скопировать";
        }
        setTimeout(() => copy.textContent = "Копировать", 1300);
      };
      bubble.append(copy);
    }

    container.append(bubble);
  });

  container.scrollTop = container.scrollHeight;
}

function selectChat(id) {
  activeId = id;
  save();

  const chat = active();
  $("title").textContent = chat ? chat.name : "Выбери чат";
  $("sub").textContent = chat ? getHost(chat.url) : "Добавь модель, чтобы начать";

  if (chat) paintAvatar($("topAv"), chat.name);
  else {
    $("topAv").textContent = "✦";
    $("topAv").style.cssText = "";
  }

  $("inp").placeholder = chat ? "Напиши сообщение…" : "Сначала добавь чат…";
  updateButtons();
  renderList();
  renderMessages();
}

function getHost(url) {
  try {
    return new URL(url).host;
  } catch (_) {
    return "Модель подключена";
  }
}

function updateButtons() {
  const chat = active();
  $("inp").disabled = !chat || busy;
  $("attach").disabled = !chat || busy;
  $("send").disabled = !chat || busy;
  $("clearBtn").disabled = !chat || busy;
}

function deleteChat(id) {
  const chat = chats.find(item => item.id === id);
  if (!chat || !confirm("Удалить чат «" + chat.name + "»?")) return;

  chats = chats.filter(item => item.id !== id);
  if (activeId === id) activeId = chats[0]?.id || null;

  save();
  selectChat(activeId);
}

function openModal() {
  $("formError").textContent = "";
  $("modal").classList.remove("hidden");
  setTimeout(() => $("mName").focus(), 30);
}

function closeModal() {
  $("modal").classList.add("hidden");
  $("form").reset();
  $("mUrl").value = DEFAULT_URL;
  $("formError").textContent = "";
}

$("addBtn").onclick = () => {
  $("side").classList.remove("open");
  openModal();
};
$("cancel").onclick = closeModal;
$("menuBtn").onclick = () => $("side").classList.toggle("open");
$("search").addEventListener("input", renderList);

$("modal").addEventListener("click", event => {
  if (event.target === $("modal")) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
    $("side").classList.remove("open");
  }
});

$("form").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("mName").value.trim();
  const key = $("mKey").value.trim();
  const url = $("mUrl").value.trim().replace(/\/+$/, "");

  if (!name || !key || !url) {
    $("formError").textContent = "Заполни все поля.";
    return;
  }

  try {
    const parsed = new URL(url);
    if (!["https:", "http:"].includes(parsed.protocol)) throw new Error();
  } catch (_) {
    $("formError").textContent = "Укажи корректный адрес API.";
    return;
  }

  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  chats.push({id, name, key, url, messages: []});
  closeModal();
  selectChat(id);
});

$("attach").onclick = () => $("file").click();

function addFiles(files) {
  if (!active()) return;

  let skipped = 0;
  for (const file of files) {
    if (pending.length >= MAX_FILES || file.size > MAX_FILE_SIZE) {
      skipped++;
      continue;
    }
    pending.push(file);
  }

  if (skipped) alert("Лимит: до 5 файлов, каждый не больше 15 МБ.");
  renderPending();
}

$("file").addEventListener("change", () => {
  addFiles(Array.from($("file").files));
  $("file").value = "";
});

window.addEventListener("dragover", event => event.preventDefault());
window.addEventListener("drop", event => {
  event.preventDefault();
  addFiles(Array.from(event.dataTransfer?.files || []));
});

window.addEventListener("paste", event => {
  const files = Array.from(event.clipboardData?.files || []);
  if (files.length) {
    event.preventDefault();
    addFiles(files);
  }
});

function renderPending() {
  const container = $("prev");
  container.replaceChildren();

  pending.forEach((file, index) => {
    const item = document.createElement("div");
    item.className = "pv";

    const label = document.createElement("span");
    label.textContent = (file.type.startsWith("image/") ? "🖼 " : "📎 ") + file.name;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.setAttribute("aria-label", "Удалить файл " + file.name);
    remove.onclick = () => {
      pending.splice(index, 1);
      renderPending();
    };

    item.append(label, remove);
    container.append(item);
  });
}

const toDataURL = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(new Error("Не удалось прочитать изображение."));
  reader.readAsDataURL(file);
});

async function prepareFiles(files) {
  const images = [];
  const textParts = [];

  for (const file of files) {
    if (file.type.startsWith("image/")) {
      images.push(file);
      continue;
    }

    const allowedText =
      /\.(txt|md|csv|tsv|json|log|xml|html?|css|js|py|ya?ml)$/i.test(file.name);

    if (!allowedText) {
      textParts.push("[Файл " + file.name + ": этот формат не читается в браузере.]");
      continue;
    }

    try {
      const text = await file.text();
      textParts.push("[Файл " + file.name + "]\n" + text.slice(0, MAX_FILE_TEXT));
    } catch (_) {
      textParts.push("[Файл " + file.name + ": не удалось прочитать.]");
    }
  }

  return {images, extra: textParts.join("\n\n")};
}

function getHistory(chat) {
  return chat.messages
    .filter(message => !message.err && message.text)
    .slice(-20)
    .map(message => ({
      role: message.who === "ai" ? "assistant" : "user",
      content: message.text + (message.ctx ? "\n\n" + message.ctx : "")
    }));
}

function endpoints(url) {
  if (url.endsWith("/chat/completions")) return [url];
  if (url.endsWith("/v1")) return [url + "/chat/completions"];
  return [url + "/v1/chat/completions", url + "/chat/completions"];
}

async function requestWorker(url, key, body) {
  const response = await fetch(PROXY, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({url, key, body})
  });

  const raw = await response.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch (_) {
    data = null;
  }

  if (!response.ok) {
    const message = data?.error || raw.slice(0, 300) || "Ошибка Worker";
    throw new Error("Worker HTTP " + response.status + ": " + message);
  }

  if (!data) throw new Error("Worker вернул ответ не в формате JSON.");
  return data;
}

async function ask(chat, text, prepared) {
  const userText = [text, prepared.extra].filter(Boolean).join("\n\n") ||
    "Посмотри вложения.";

  const content = [{type:"text", text:userText}];
  for (const image of prepared.images) {
    content.push({
      type:"image_url",
      image_url:{url:await toDataURL(image)}
    });
  }

  const body = {
    model: chat.name,
    messages: [
      {role:"system", content:"Ты полезный ИИ-помощник. Отвечай на языке пользователя."},
      ...getHistory(chat),
      {role:"user", content:content.length === 1 ? userText : content}
    ]
  };

  let lastError;

  for (const endpoint of endpoints(chat.url)) {
    let data;

    try {
      data = await requestWorker(endpoint, chat.key, body);
    } catch (error) {
      // Переходим ко второму стандартному пути только при 404/405.
      if (/Worker HTTP (404|405):/.test(error.message)) {
        lastError = error;
        continue;
      }
      throw error;
    }

    let answer = data.choices?.[0]?.message?.content;
    if (Array.isArray(answer)) {
      answer = answer.map(part => part.text || "").join("\n");
    }
    return answer || "Пустой ответ от модели.";
  }

  throw lastError || new Error("Не удалось найти endpoint chat/completions.");
}

async function send() {
  const chat = active();
  const text = $("inp").value.trim();

  if (!chat || busy || (!text && !pending.length)) return;

  const files = pending.slice();
  busy = true;
  updateButtons();

  $("inp").value = "";
  $("inp").style.height = "auto";
  pending = [];
  renderPending();
  $("typing").classList.remove("hidden");

  try {
    const prepared = await prepareFiles(files);

    chat.messages.push({
      who:"user",
      text:text || "Посмотри вложения.",
      ctx:prepared.extra,
      files:files.map(file => ({name:file.name, type:file.type}))
    });

    save();
    renderMessages();
    renderList();

    const answer = await ask(chat, text, prepared);
    chat.messages.push({who:"ai", text:answer});
  } catch (error) {
    chat.messages.push({
      who:"ai",
      err:true,
      text:"Не удалось получить ответ: " + error.message
    });
  } finally {
    busy = false;
    $("typing").classList.add("hidden");
    updateButtons();
    save();
    renderMessages();
    renderList();
  }
}

$("send").onclick = send;

$("inp").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});

$("inp").addEventListener("input", () => {
  const input = $("inp");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

$("clearBtn").onclick = () => {
  const chat = active();
  if (!chat || busy) return;

  if (confirm("Очистить переписку?")) {
    chat.messages = [];
    save();
    renderMessages();
    renderList();
  }
};

load();
selectChat(activeId);
</script>
