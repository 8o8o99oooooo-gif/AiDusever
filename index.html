<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИИ-чаты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1117;--p1:#171a23;--p2:#1f2330;--line:#2b3040;--tx:#eceef4;--mu:#8b93a7;--ac:#ff8a4c;--ac2:#ffb36b;--ai:#1f2330;--me:linear-gradient(135deg,#ff8a4c,#f0623a);--r:18px}
@media(prefers-color-scheme:light){:root{--bg:#f4f1ec;--p1:#fffdf9;--p2:#f0ebe3;--line:#e2dacd;--tx:#26221c;--mu:#7d7466;--ai:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.app{display:flex;height:100dvh;padding-top:env(safe-area-inset-top)}
.side{width:300px;flex:none;background:var(--p1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 6px}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--me);display:grid;place-items:center;font-style:normal;color:#fff}
.new{background:var(--me);color:#fff;border-radius:14px;padding:12px;font-weight:700}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--p2)}
.row.on{background:var(--p2);border-color:var(--ac)}
.av{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px}
.inf{flex:1;min-width:0}
.inf b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf small{color:var(--mu);font-size:12px}
.x{color:var(--mu);font-size:20px;padding:2px 8px;border-radius:8px}
.x:hover{color:#ff5d5d}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--p1)}
.top .inf b{font-size:16px}
.ico{width:38px;height:38px;border-radius:12px;background:var(--p2);font-size:18px;flex:none}
.menu{display:none}
.msgs{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--mu);max-width:300px}
.empty big{display:block;font-size:46px;margin-bottom:8px}
.m{max-width:min(720px,88%);padding:11px 14px;border-radius:var(--r);overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.m.user{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:5px}
.m.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:5px}
.m.err{border-color:#ff5d5d;color:#ff8b8b}
.m pre{background:#0b0d12;color:#e6e8ee;padding:12px;border-radius:12px;overflow:auto;white-space:pre;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
.m code{font:13px ui-monospace,Menlo,Consolas,monospace;background:#8883;padding:1px 5px;border-radius:6px}
.m pre code{background:none;padding:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:#fff3;border:1px solid #fff3}
.cp{position:absolute;right:6px;bottom:-12px;font-size:11px;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:1px 7px;color:var(--mu)}
.typing{padding:0 18px 8px;color:var(--mu);font-size:13px}
.typing b{display:inline-block;animation:b 1s infinite}.typing b:nth-child(3){animation-delay:.15s}.typing b:nth-child(4){animation-delay:.3s}
@keyframes b{50%{opacity:.2;transform:translateY(-2px)}}
.comp{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--p1);border-top:1px solid var(--line)}
.prev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pv{font-size:12px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;gap:6px}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--p2);border:1px solid var(--line);border-radius:20px;padding:6px}
.box:focus-within{border-color:var(--ac)}
textarea{flex:1;resize:none;background:none;border:0;outline:0;padding:9px 6px;max-height:140px;min-height:40px;font-size:16px}
.box .ico{background:none}
.send{width:40px;height:40px;border-radius:14px;background:var(--me);color:#fff;font-size:18px;flex:none}
button:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(100%,430px);background:var(--p1);border:1px solid var(--line);border-radius:24px;padding:22px}
.card h2{margin:0 0 4px}.card p{margin:0 0 14px;color:var(--mu);font-size:13px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;font-weight:700;color:var(--mu)}
.f input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--p2);padding:0 12px;outline:0;font-size:16px}
.f input:focus{border-color:var(--ac)}
.er{color:#ff6b6b;font-size:13px;min-height:18px}
.acts{display:flex;gap:8px;margin-top:8px}.acts button{flex:1;height:46px;border-radius:13px;font-weight:700;background:var(--p2)}
.acts .ok{background:var(--me);color:#fff}
@media(max-width:760px){
.side{position:fixed;z-index:40;inset:0 auto 0 0;width:min(84%,320px);transform:translateX(-100%);transition:.22s;padding-top:calc(16px + env(safe-area-inset-top))}
.side.open{transform:none;box-shadow:0 0 0 100vmax #0008}
.menu{display:block}
.m{max-width:92%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>✦</i>ИИ-чаты</div>
    <button class="new" id="addBtn">＋ Новый чат</button>
    <div class="list" id="list"></div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="ico menu" id="menuBtn" aria-label="Чаты">☰</button>
      <div class="av" id="topAv">✦</div>
      <div class="inf"><b id="title">Выбери чат</b><small id="sub">Добавь модель, чтобы начать</small></div>
      <button class="ico" id="clearBtn" title="Очистить">🗑</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="typing hidden" id="typing">ИИ печатает <b>.</b><b>.</b><b>.</b></div>
    <div class="comp">
      <div class="prev" id="prev"></div>
      <div class="box">
        <button class="ico" id="attach" aria-label="Файл">📎</button>
        <input id="file" type="file" multiple class="hidden" accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">
        <textarea id="inp" rows="1" placeholder="Напиши сообщение…"></textarea>
        <button class="send" id="send" aria-label="Отправить">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="modal hidden" id="modal">
  <form class="card" id="form">
    <h2>Новый чат с ИИ</h2>
    <p>Точное имя модели, API-ключ и адрес API. Всё хранится только в этом браузере.</p>
    <div class="f"><label>Название модели</label><input id="mName" placeholder="например, gpt-4o" autocomplete="off" required></div>
    <div class="f"><label>API-ключ</label><input id="mKey" type="password" placeholder="sk-…" autocomplete="off" required></div>
    <div class="f"><label>Ссылка API</label><input id="mUrl" value="https://darkapi.shop" required></div>
    <div class="er" id="mErr"></div>
    <div class="acts"><button type="button" id="cancel">Отмена</button><button class="ok" type="submit">Добавить</button></div>
  </form>
</div>

<script>
// "" = тот же сайт, где открыт index.html (Flask). Если фронтенд на GitHub Pages,
// а main.py лежит на хостинге — впиши сюда его адрес, например "https://my-app.onrender.com"
const BACKEND = "";
// Адрес Cloudflare Worker (см. worker.js), например "https://ai-proxy.твой-ник.workers.dev"
const PROXY = "https://ai-proxy.8o8o99oooooo.workers.dev/";
const DEFAULT_URL = "https://darkapi.shop";
const KEY = "telegram_ai_chat_manager_v2";
const tg = window.Telegram?.WebApp;
try { tg?.ready(); tg?.expand(); } catch (e) {}

const $ = id => document.getElementById(id);
let chats = [], activeId = null, pending = [], busy = false;

function save() { try { localStorage.setItem(KEY, JSON.stringify({chats, activeId})); } catch (e) { console.warn(e); } }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && Array.isArray(s.chats)) {
      chats = s.chats.filter(c => c && c.id && c.name).map(c => ({id: String(c.id), name: String(c.name), key: String(c.key || ""), url: String(c.url || DEFAULT_URL), messages: Array.isArray(c.messages) ? c.messages : []}));
      activeId = chats.some(c => c.id === s.activeId) ? s.activeId : (chats[0]?.id || null);
    }
  } catch (e) { chats = []; }
}
const active = () => chats.find(c => c.id === activeId) || null;

const BRANDS = [["claude","✳","#f6e1d3","#b4532a","Claude"],["deepseek","🐋","#dbeaff","#1a63c4","DeepSeek"],["gemini","✦","#e6e1ff","#5d49c9","Gemini"],["grok","𝕏","#e4e8ee","#1d2732","Grok"],["gpt","◎","#d9f5ea","#087a63","ChatGPT"],["openai","◎","#d9f5ea","#087a63","OpenAI"]];
function brand(name) {
  const n = name.toLowerCase(), b = BRANDS.find(x => n.includes(x[0]));
  return b ? {t: b[1], bg: b[2], fg: b[3], name: b[4]} : {t: name.slice(0, 2).toUpperCase(), bg: "#ffe3d2", fg: "#b4532a", name};
}
function paintAv(el, name) { const b = brand(name); el.textContent = b.t; el.style.background = b.bg; el.style.color = b.fg; el.title = b.name; }

function renderList() {
  const l = $("list"); l.replaceChildren();
  chats.forEach(c => {
    const r = document.createElement("div"); r.className = "row" + (c.id === activeId ? " on" : "");
    const av = document.createElement("div"); av.className = "av"; paintAv(av, c.name);
    const inf = document.createElement("div"); inf.className = "inf";
    const b = document.createElement("b"); b.textContent = c.name;
    const s = document.createElement("small"); s.textContent = brand(c.name).name + " · " + c.messages.length + " сообщ.";
    inf.append(b, s);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Удалить";
    x.onclick = e => { e.stopPropagation(); del(c.id); };
    r.append(av, inf, x); r.onclick = () => { select(c.id); $("side").classList.remove("open"); };
    l.append(r);
  });
}

// безопасный мини-markdown: код, `inline`, **жирный**
function esc(s) { return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }
function md(t) {
  const parts = t.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) return "<pre><code>" + esc(p.replace(/^[\w+-]*\n/, "").replace(/\n$/, "")) + "</code></pre>";
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}

function renderMsgs() {
  const a = $("msgs"), c = active(); a.replaceChildren();
  if (!c || !c.messages.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = c ? "<big>💬</big><b>Начни общение</b><br>Напиши сообщение или прикрепи фото / файл."
                    : "<big>✦</big><b>Пока нет чатов</b><br>Нажми «Новый чат», чтобы подключить свою модель.";
    a.append(e); return;
  }
  c.messages.forEach(m => {
    const d = document.createElement("div"); d.className = "m " + m.who + (m.err ? " err" : "");
    if (m.who === "ai") d.innerHTML = md(m.text || ""); else d.textContent = m.text || "";
    if (m.files?.length) {
      const t = document.createElement("div"); t.className = "tags";
      m.files.forEach(f => { const g = document.createElement("span"); g.className = "tag"; g.textContent = (f.type?.startsWith("image/") ? "🖼 " : "📎 ") + f.name; t.append(g); });
      d.append(t);
    }
    if (m.who === "ai" && !m.err) {
      const cp = document.createElement("button"); cp.className = "cp"; cp.textContent = "копировать";
      cp.onclick = () => { navigator.clipboard?.writeText(m.text); cp.textContent = "готово ✓"; setTimeout(() => cp.textContent = "копировать", 1200); };
      d.append(cp);
    }
    a.append(d);
  });
  a.scrollTop = a.scrollHeight;
}

function select(id) {
  activeId = id; save();
  const c = active();
  $("title").textContent = c ? c.name : "Выбери чат";
  $("sub").textContent = c ? "Модель подключена" : "Добавь модель, чтобы начать";
  if (c) paintAv($("topAv"), c.name); else { $("topAv").textContent = "✦"; $("topAv").style.cssText = ""; }
  updateButtons();
  $("inp").placeholder = c ? "Напиши сообщение…" : "Сначала добавь чат…";
  renderList(); renderMsgs();
}
function updateButtons() {
  const c = active();
  $("inp").disabled = !c; $("attach").disabled = !c; $("send").disabled = !c || busy; $("clearBtn").disabled = !c;
}
function del(id) {
  const c = chats.find(x => x.id === id);
  if (!c || !confirm("Удалить чат «" + c.name + "»?")) return;
  chats = chats.filter(x => x.id !== id);
  select(activeId === id ? (chats[0]?.id || null) : activeId);
}

const openM = () => { $("modal").classList.remove("hidden"); $("mErr").textContent = ""; $("mName").focus(); };
const closeM = () => { $("modal").classList.add("hidden"); $("form").reset(); $("mUrl").value = DEFAULT_URL; };
$("addBtn").onclick = () => { $("side").classList.remove("open"); openM(); };
$("cancel").onclick = closeM;
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeM(); });
$("menuBtn").onclick = () => $("side").classList.toggle("open");
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("mName").value.trim(), key = $("mKey").value.trim(), url = $("mUrl").value.trim().replace(/\/+$/, "");
  if (!name || !key || !url) { $("mErr").textContent = "Заполни все поля."; return; }
  if (!/^https?:\/\//i.test(url)) { $("mErr").textContent = "Ссылка должна начинаться с https://"; return; }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  chats.push({id, name, key, url, messages: []});
  closeM(); select(id);
});

$("attach").onclick = () => $("file").click();
$("file").addEventListener("change", () => {
  pending.push(...Array.from($("file").files).slice(0, Math.max(0, 5 - pending.length)));
  $("file").value = ""; renderPrev();
});
function renderPrev() {
  $("prev").replaceChildren();
  pending.forEach((f, i) => {
    const p = document.createElement("div"); p.className = "pv";
    const s = document.createElement("span"); s.textContent = (f.type.startsWith("image/") ? "🖼 " : "📎 ") + f.name;
    const x = document.createElement("button"); x.textContent = "×"; x.onclick = () => { pending.splice(i, 1); renderPrev(); };
    p.append(s, x); $("prev").append(p);
  });
}

// ---------- отправка ----------
const toDataURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const TEXT_EXT = /\.(txt|md|csv|json)$/i;

function endpoints(u) {
  if (u.endsWith("/chat/completions")) return [u];
  if (u.endsWith("/v1")) return [u + "/chat/completions"];
  return [u + "/v1/chat/completions", u + "/chat/completions"];
}
function history(c) {  // последние сообщения как контекст (без текущего)
  return c.messages.filter(m => !m.err && m.text).slice(-21, -1).map(m => ({role: m.who === "ai" ? "assistant" : "user", content: m.text}));
}

async function viaBackend(c, text, files) {
  const f = new FormData();
  f.append("message", text); f.append("model", c.name); f.append("api_key", c.key); f.append("api_url", c.url);
  f.append("history", JSON.stringify(history(c)));
  files.forEach(x => f.append("files", x, x.name));
  const r = await fetch(BACKEND + "/api/chat", {method: "POST", body: f});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || "Ошибка сервера (" + r.status + ")"); e.status = r.status; throw e; }
  return d.reply || "Пустой ответ.";
}

async function direct(c, text, files) {  // прямой запрос из браузера (работает на GitHub Pages)
  const content = [], extra = [];
  for (const f of files) {
    if (f.type.startsWith("image/")) content.push({type: "image_url", image_url: {url: await toDataURL(f)}});
    else if (TEXT_EXT.test(f.name)) extra.push("[Файл " + f.name + "]\n" + (await f.text()).slice(0, 12000));
    else extra.push("[Прикреплён файл " + f.name + ": чтение этого формата не поддерживается]");
  }
  content.unshift({type: "text", text: [text, ...extra].filter(Boolean).join("\n\n") || "Посмотри вложения."});
  const body = {model: c.name, messages: [{role: "system", content: "Ты полезный ИИ-помощник. Отвечай на языке пользователя."}, ...history(c), {role: "user", content: content.length === 1 ? content[0].text : content}]};
  let last = "";
  for (const ep of endpoints(c.url)) {
    let r;
    try {
      r = PROXY
        ? await fetch(PROXY, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({url: ep, key: c.key, body})})
        : await fetch(ep, {method: "POST", headers: {"Content-Type": "application/json", Authorization: "Bearer " + c.key}, body: JSON.stringify(body)});
    }
    catch (e) { throw new Error(PROXY ? "Воркер " + PROXY + " недоступен или отклонил запрос. Открой этот адрес в браузере (должно быть POST only) и проверь ALLOWED_ORIGIN = " + location.origin : "PROXY в index.html пустой — впиши адрес Cloudflare Worker."); }
    if (r.status === 404 || r.status === 405) { last = "HTTP " + r.status; continue; }
    const t = await r.text();
    if (!r.ok) throw new Error("API вернул HTTP " + r.status + ": " + t.slice(0, 300));
    let d; try { d = JSON.parse(t); } catch { throw new Error("API вернул не JSON. Проверь адрес."); }
    let a = d.choices?.[0]?.message?.content;
    if (Array.isArray(a)) a = a.map(x => x.text || "").join("\n");
    return a || "Пустой ответ.";
  }
  throw new Error("Адрес API не найден (" + last + ")");
}

async function ask(c, text, files) {
  const onPages = /github\.io$/i.test(location.hostname) || location.protocol === "file:";
  if (BACKEND || !onPages) {
    try { return await viaBackend(c, text, files); }
    catch (e) { if (!(e.status === 404 || e.status === 405 || e instanceof TypeError)) throw e; }  // сервера нет → напрямую
  }
  return direct(c, text, files);
}

async function send() {
  const c = active(), text = $("inp").value.trim();
  if (!c || busy || (!text && !pending.length)) return;
  const files = pending.slice();
  c.messages.push({who: "user", text: text || "Посмотри вложения.", files: files.map(f => ({name: f.name, type: f.type}))});
  save(); $("inp").value = ""; $("inp").style.height = "auto"; pending = []; renderPrev();
  busy = true; updateButtons(); renderMsgs(); renderList(); $("typing").classList.remove("hidden");
  try { c.messages.push({who: "ai", text: await ask(c, text, files)}); }
  catch (e) { c.messages.push({who: "ai", err: true, text: "Не удалось получить ответ: " + e.message + "\nПроверь адрес API, название модели и ключ."}); }
  busy = false; save(); $("typing").classList.add("hidden"); updateButtons(); renderMsgs(); renderList();
}
$("send").onclick = send;
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); send(); } });
$("inp").addEventListener("input", () => { const t = $("inp"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; });
$("clearBtn").onclick = () => { const c = active(); if (c && confirm("Очистить переписку?")) { c.messages = []; save(); renderMsgs(); renderList(); } };

load(); select(activeId);
</script>
</body>
</html>
