<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a23">
<title>ИИ-чаты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  color-scheme: dark;
  --bg: #0f1117;
  --p1: #171a23;
  --p2: #1f2330;
  --line: #2b3040;
  --tx: #eceef4;
  --mu: #8b93a7;
  --ac: #ff8a4c;
  --ai: #1f2330;
  --me: linear-gradient(135deg, #ff8a4c, #f0623a);
  --r: 18px;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f1ec;
    --p1: #fffdf9;
    --p2: #f0ebe3;
    --line: #e2dacd;
    --tx: #26221c;
    --mu: #7d7466;
    --ai: #fff;
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
}

body {
  font: 15px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system,
    "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--tx);
  overflow: hidden;
}

button,
textarea,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  transition: transform .12s ease, background .12s ease, opacity .12s ease;
}

button:active:not(:disabled) {
  transform: scale(.97);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.app {
  display: flex;
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
}

.side {
  width: 300px;
  flex: none;
  background: var(--p1);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  gap: 12px;
  z-index: 40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 18px;
  padding: 0 6px;
}

.brand i {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: var(--me);
  display: grid;
  place-items: center;
  font-style: normal;
  color: #fff;
}

.new {
  background: var(--me);
  color: #fff;
  border-radius: 14px;
  padding: 12px;
  font-weight: 700;
}

.chat-search {
  width: 100%;
  min-height: 44px;
  padding: 0 13px;
  color: var(--tx);
  background: var(--p2);
  border: 1px solid var(--line);
  border-radius: 13px;
  outline: none;
}

.chat-search:focus {
  border-color: var(--ac);
}

.chat-search::placeholder {
  color: var(--mu);
}

.list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.row {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 14px;
  cursor: pointer;
  border: 1px solid transparent;
}

.row:hover {
  background: var(--p2);
}

.row.on {
  background: var(--p2);
  border-color: var(--ac);
}

.av {
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
}

.inf {
  flex: 1;
  min-width: 0;
}

.inf b {
  display: block;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inf small {
  color: var(--mu);
  font-size: 12px;
}

.x {
  color: var(--mu);
  font-size: 20px;
  padding: 2px 8px;
  border-radius: 8px;
}

.x:hover {
  color: #ff5d5d;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--p1);
}

.top .inf b {
  font-size: 16px;
}

.ico {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--p2);
  font-size: 18px;
  flex: none;
}

.menu {
  display: none;
}

.msgs {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.empty {
  margin: auto;
  text-align: center;
  color: var(--mu);
  max-width: 300px;
}

.empty big {
  display: block;
  font-size: 46px;
  margin-bottom: 8px;
}

.m {
  max-width: min(720px, 88%);
  padding: 11px 14px;
  border-radius: var(--r);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  position: relative;
}

.m.user {
  align-self: flex-end;
  background: var(--me);
  color: #fff;
  border-bottom-right-radius: 5px;
}

.m.ai {
  align-self: flex-start;
  background: var(--ai);
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
}

.m.err {
  border-color: #ff5d5d;
  color: #ff8b8b;
}

.m pre {
  background: #0b0d12;
  color: #e6e8ee;
  padding: 12px;
  border-radius: 12px;
  overflow: auto;
  white-space: pre;
  font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
  margin: 8px 0;
}

.m code {
  font: 13px ui-monospace, Menlo, Consolas, monospace;
  background: #8883;
  padding: 1px 5px;
  border-radius: 6px;
}

.m pre code {
  background: none;
  padding: 0;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.tag {
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 8px;
  background: #fff3;
  border: 1px solid #fff3;
}

.cp {
  position: absolute;
  right: 6px;
  bottom: -12px;
  font-size: 11px;
  background: var(--p2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 1px 7px;
  color: var(--mu);
}

.typing {
  padding: 0 18px 8px;
  color: var(--mu);
  font-size: 13px;
}

.typing b {
  display: inline-block;
  animation: blink 1s infinite;
}

.typing b:nth-child(3) {
  animation-delay: .15s;
}

.typing b:nth-child(4) {
  animation-delay: .3s;
}

@keyframes blink {
  50% {
    opacity: .2;
    transform: translateY(-2px);
  }
}

.comp {
  padding: 10px 12px max(10px, env(safe-area-inset-bottom));
  background: var(--p1);
  border-top: 1px solid var(--line);
}

.prev {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

.pv {
  max-width: 100%;
  font-size: 12px;
  background: var(--p2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px 9px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.pv span {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--p2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px;
}

.box:focus-within {
  border-color: var(--ac);
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  background: none;
  border: 0;
  outline: 0;
  padding: 9px 6px;
  max-height: 140px;
  min-height: 40px;
  font-size: 16px;
}

.box .ico {
  background: none;
}

.send {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: var(--me);
  color: #fff;
  font-size: 18px;
  flex: none;
}

.modal {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.card {
  width: min(100%, 430px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  background: var(--p1);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px;
}

.card h2 {
  margin: 0 0 4px;
}

.card p {
  margin: 0 0 14px;
  color: var(--mu);
  font-size: 13px;
}

.f {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 12px;
}

.f label {
  font-size: 12px;
  font-weight: 700;
  color: var(--mu);
}

.f input {
  height: 46px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--p2);
  padding: 0 12px;
  outline: 0;
  font-size: 16px;
}

.f input:focus {
  border-color: var(--ac);
}

.er {
  color: #ff6b6b;
  font-size: 13px;
  min-height: 18px;
}

.acts {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.acts button {
  flex: 1;
  height: 46px;
  border-radius: 13px;
  font-weight: 700;
  background: var(--p2);
}

.acts .ok {
  background: var(--me);
  color: #fff;
}

@media (max-width: 760px) {
  .side {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(84%, 320px);
    transform: translateX(-100%);
    transition: transform .22s ease;
    padding-top: max(16px, env(safe-area-inset-top));
  }

  .side.open {
    transform: translateX(0);
    box-shadow: 0 0 0 100vmax #0008;
  }

  .menu {
    display: block;
  }

  .m {
    max-width: 92%;
  }

  .top {
    padding-top: max(12px, env(safe-area-inset-top));
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>✦</i>ИИ-чаты</div>
    <button class="new" id="addBtn" type="button">＋ Новый чат</button>

    <input
      id="chatSearch"
      class="chat-search"
      type="search"
      placeholder="Поиск по чатам…"
      autocomplete="off"
      aria-label="Поиск по чатам"
    >

    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="ico menu" id="menuBtn" type="button" aria-label="Открыть список чатов">☰</button>
      <div class="av" id="topAv">✦</div>
      <div class="inf">
        <b id="title">Выбери чат</b>
        <small id="sub">Добавь модель, чтобы начать</small>
      </div>
      <button class="ico" id="clearBtn" type="button" title="Очистить переписку" aria-label="Очистить переписку">🗑</button>
    </div>

    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="typing hidden" id="typing">ИИ печатает <b>.</b><b>.</b><b>.</b></div>

    <div class="comp">
      <div class="prev" id="prev"></div>
      <div class="box">
        <button class="ico" id="attach" type="button" aria-label="Прикрепить файл">📎</button>
        <input id="file" type="file" multiple class="hidden">
        <textarea id="inp" rows="1" placeholder="Напиши сообщение…" aria-label="Сообщение"></textarea>
        <button class="send" id="send" type="button" aria-label="Отправить">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="modal hidden" id="modal">
  <form class="card" id="form">
    <h2>Новый чат с ИИ</h2>
    <p>Укажите название модели, API-ключ и адрес совместимого API.</p>

    <div class="f">
      <label for="mName">Название модели</label>
      <input id="mName" placeholder="например, gpt-4o" autocomplete="off" required>
    </div>

    <div class="f">
      <label for="mKey">API-ключ</label>
      <input id="mKey" type="password" placeholder="API-ключ" autocomplete="new-password" required>
    </div>

    <div class="f">
      <label for="mUrl">Ссылка API</label>
      <input id="mUrl" type="url" value="https://darkapi.shop" required>
    </div>

    <div class="er" id="mErr" role="alert"></div>

    <div class="acts">
      <button type="button" id="cancel">Отмена</button>
      <button class="ok" type="submit">Добавить</button>
    </div>
  </form>
</div>

<script>
"use strict";

// Если backend размещён отдельно, укажите адрес, например:
// const BACKEND = "https://your-server.example";
const BACKEND = "";

// Адрес вашего Cloudflare Worker.
// Оставьте пустым, если используете backend.
const PROXY = "https://ai-proxy.8o8o99oooooo.workers.dev/";

const DEFAULT_URL = "https://darkapi.shop";
const STORAGE_KEY = "telegram_ai_chat_manager_v2";
const MAX_FILE_SIZE = 15 * 1024 * 1024;
const MAX_FILES = 5;

const tg = window.Telegram?.WebApp;
try {
  tg?.ready();
  tg?.expand();
  tg?.setHeaderColor?.("#171a23");
  tg?.setBackgroundColor?.("#0f1117");
} catch (_) {}

const $ = id => document.getElementById(id);

let chats = [];
let activeId = null;
let pending = [];
let busy = false;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ chats, activeId }));
  } catch (e) {
    console.warn("Не удалось сохранить данные:", e);
  }
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

    if (saved && Array.isArray(saved.chats)) {
      chats = saved.chats
        .filter(c => c && c.id && c.name)
        .map(c => ({
          id: String(c.id),
          name: String(c.name),
          key: String(c.key || ""),
          url: String(c.url || DEFAULT_URL),
          messages: Array.isArray(c.messages) ? c.messages : []
        }));

      activeId = chats.some(c => c.id === saved.activeId)
        ? saved.activeId
        : chats[0]?.id || null;
    }
  } catch (e) {
    chats = [];
    activeId = null;
    console.warn("Не удалось загрузить историю:", e);
  }
}

const active = () => chats.find(c => c.id === activeId) || null;

const BRANDS = [
  ["claude", "✳", "#f6e1d3", "#b4532a", "Claude"],
  ["deepseek", "🐋", "#dbeaff", "#1a63c4", "DeepSeek"],
  ["gemini", "✦", "#e6e1ff", "#5d49c9", "Gemini"],
  ["grok", "𝕏", "#e4e8ee", "#1d2732", "Grok"],
  ["gpt", "◎", "#d9f5ea", "#087a63", "ChatGPT"],
  ["openai", "◎", "#d9f5ea", "#087a63", "OpenAI"]
];

function brand(name) {
  const lower = String(name || "").toLowerCase();
  const found = BRANDS.find(item => lower.includes(item[0]));

  return found
    ? { text: found[1], bg: found[2], fg: found[3], name: found[4] }
    : {
        text: String(name || "ИИ").slice(0, 2).toUpperCase(),
        bg: "#ffe3d2",
        fg: "#b4532a",
        name: String(name || "ИИ")
      };
}

function paintAvatar(element, name) {
  const model = brand(name);
  element.textContent = model.text;
  element.style.background = model.bg;
  element.style.color = model.fg;
  element.title = model.name;
}

function renderList() {
  const list = $("list");
  const query = $("chatSearch").value.trim().toLowerCase();

  list.replaceChildren();

  const filteredChats = chats.filter(chat =>
    chat.name.toLowerCase().includes(query)
  );

  if (!filteredChats.length && query) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Чаты не найдены";
    list.append(empty);
    return;
  }

  filteredChats.forEach(chat => {
    const row = document.createElement("div");
    row.className = "row" + (chat.id === activeId ? " on" : "");

    const avatar = document.createElement("div");
    avatar.className = "av";
    paintAvatar(avatar, chat.name);

    const info = document.createElement("div");
    info.className = "inf";

    const title = document.createElement("b");
    title.textContent = chat.name;

    const subtitle = document.createElement("small");
    subtitle.textContent =
      brand(chat.name).name + " · " + chat.messages.length + " сообщ.";

    info.append(title, subtitle);

    const removeButton = document.createElement("button");
    removeButton.className = "x";
    removeButton.type = "button";
    removeButton.textContent = "×";
    removeButton.title = "Удалить чат";
    removeButton.setAttribute("aria-label", "Удалить чат " + chat.name);
    removeButton.onclick = event => {
      event.stopPropagation();
      deleteChat(chat.id);
    };

    row.append(avatar, info, removeButton);
    row.onclick = () => {
      selectChat(chat.id);
      $("side").classList.remove("open");
    };

    list.append(row);
  });
}

function escapeHTML(text) {
  return String(text).replace(/[&<>]/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;"
  })[char]);
}

function renderMarkdown(text) {
  const parts = String(text).split(/
/);

  return parts.map((part, index) => {
    if (index % 2) {
      return "<pre><code>" +
        escapeHTML(part.replace(/^[\w+-]*\n/, "").replace(/\n$/, "")) +
        "</code></pre>";
    }

    return escapeHTML(part)
      .replace(/([^\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}

function renderMessages() {
  const container = $("msgs");
  const chat = active();

  container.replaceChildren();

  if (!chat || !chat.messages.length) {
    const empty = document.createElement("div");
    empty.className = "empty";

    if (chat) {
      empty.innerHTML =
        "<big>💬</big><b>Начни общение</b><br>" +
        "Напиши сообщение или прикрепи файл.";
    } else {
      empty.innerHTML =
        "<big>✦</big><b>Пока нет чатов</b><br>" +
        "Нажми «Новый чат», чтобы подключить модель.";
    }

    container.append(empty);
    return;
  }

  chat.messages.forEach(message => {
    const bubble = document.createElement("div");
    bubble.className =
      "m " + (message.who === "user" ? "user" : "ai") +
      (message.err ? " err" : "");

    if (message.who === "ai") {
      bubble.innerHTML = renderMarkdown(message.text || "");
    } else {
      bubble.textContent = message.text || "";
    }

    if (Array.isArray(message.files) && message.files.length) {
      const tags = document.createElement("div");
      tags.className = "tags";

      message.files.forEach(file => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent =
          (file.type?.startsWith("image/") ? "🖼 " : "📎 ") + file.name;
        tags.append(tag);
      });

      bubble.append(tags);
    }

    if (message.who === "ai" && !message.err) {
      const copyButton = document.createElement("button");
      copyButton.className = "cp";
      copyButton.type = "button";
      copyButton.textContent = "копировать";

      copyButton.onclick = async () => {
        try {
          await navigator.clipboard.writeText(message.text || "");
          copyButton.textContent = "готово ✓";
        } catch (_) {
          copyButton.textContent = "не удалось";
        }

        setTimeout(() => {
          copyButton.textContent = "копировать";
        }, 1200);
      };

      bubble.append(copyButton);
    }

    container.append(bubble);
  });

  container.scrollTop = container.scrollHeight;
}

function selectChat(id) {
  activeId = id;
  save();

  const chat = active();

  $("title").textContent = chat ? chat.name : "Выбери чат";
  $("sub").textContent = chat
    ? (getHost(chat.url) || "Модель подключена")
    : "Добавь модель, чтобы начать";

  if (chat) {
    paintAvatar($("topAv"), chat.name);
  } else {
    $("topAv").textContent = "✦";
    $("topAv").style.cssText = "";
  }

  $("inp").placeholder = chat
    ? "Напиши сообщение…"
    : "Сначала добавь чат…";

  updateButtons();
  renderList();
  renderMessages();
}

function getHost(url) {
  try {
    return new URL(url).host;
  } catch (_) {
    return "Модель подключена";
  }
}

function updateButtons() {
  const chat = active();

  $("inp").disabled = !chat;
  $("attach").disabled = !chat || busy;
  $("send").disabled = !chat || busy;
  $("clearBtn").disabled = !chat || busy;
}

function deleteChat(id) {
  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  if (!confirm("Удалить чат «" + chat.name + "»?")) return;

  chats = chats.filter(item => item.id !== id);

  if (activeId === id) {
    activeId = chats[0]?.id || null;
  }

  save();
  selectChat(activeId);
}

function openModal() {
  $("modal").classList.remove("hidden");
  $("mErr").textContent = "";
  setTimeout(() => $("mName").focus(), 50);
}

function closeModal() {
  $("modal").classList.add("hidden");
  $("form").reset();
  $("mUrl").value = DEFAULT_URL;
  $("mErr").textContent = "";
}

$("addBtn").onclick = () => {
  $("side").classList.remove("open");
  openModal();
};

$("cancel").onclick = closeModal;

$("modal").addEventListener("click", event => {
  if (event.target === $("modal")) closeModal();
});

$("menuBtn").onclick = () => {
  $("side").classList.toggle("open");
};

$("chatSearch").addEventListener("input", renderList);

$("form").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("mName").value.trim();
  const key = $("mKey").value.trim();
  const url = $("mUrl").value.trim().replace(/\/+$/, "");

  if (!name || !key || !url) {
    $("mErr").textContent = "Заполни все поля.";
    return;
  }

  try {
    const parsed = new URL(url);
    if (!["http:", "https:"].includes(parsed.protocol)) {
      throw new Error("invalid protocol");
    }
  } catch (_) {
    $("mErr").textContent = "Укажи корректный адрес API, начинающийся с https://";
    return;
  }

  const id =
    Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  chats.push({
    id,
    name,
    key,
    url,
    messages: []
  });

  closeModal();
  selectChat(id);
});

$("attach").onclick = () => $("file").click();

function addFiles(fileList) {
  if (!active()) return;

  let skipped = 0;

  for (const file of fileList) {
    if (pending.length >= MAX_FILES || file.size > MAX_FILE_SIZE) {
      skipped++;
      continue;
    }

    pending.push(file);
  }

  if (skipped) {
    alert("Некоторые файлы не добавлены. Лимит: 5 файлов по 15 МБ.");
  }

  renderPending();
}

$("file").addEventListener("change", () => {
  addFiles(Array.from($("file").files));
  $("file").value = "";
});

window.addEventListener("dragover", event => event.preventDefault());

window.addEventListener("drop", event => {
  event.preventDefault();
  addFiles(Array.from(event.dataTransfer?.files || []));
});

window.addEventListener("paste", event => {
  const files = Array.from(event.clipboardData?.files || []);
  if (files.length) {
    event.preventDefault();
    addFiles(files);
  }
});

function renderPending() {
  const container = $("prev");
  container.replaceChildren();

  pending.forEach((file, index) => {
    const item = document.createElement("div");
    item.className = "pv";

    const label = document.createElement("span");
    label.textContent =
      (file.type.startsWith("image/") ? "🖼 " : "📎 ") + file.name;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.setAttribute("aria-label", "Убрать файл " + file.name);
    remove.onclick = () => {
      pending.splice(index, 1);
      renderPending();
    };

    item.append(label, remove);
    container.append(item);
  });
}

const toDataURL = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

const TEXT_RE =
  /\.(txt|md|csv|tsv|json|log|xml|html?|css|js|jsx|ts|tsx|py|java|c|h|cpp|cs|go|rs|php|rb|sql|ya?ml|ini|toml|sh|bat|env)$/i;

const LIBS = {
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  docx: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js",
  xlsx: "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  zip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
};

const loadedScripts = {};

function loadScript(src) {
  if (loadedScripts[src]) return loadedScripts[src];

  loadedScripts[src] = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => {
      delete loadedScripts[src];
      reject(new Error("Не удалось загрузить библиотеку для чтения файла."));
    };
    document.head.append(script);
  });

  return loadedScripts[src];
}

const MAX_PER_FILE = 20000;
const MAX_TOTAL = 60000;

async function extractFile(file) {
  const name = file.name.toLowerCase();

  if (TEXT_RE.test(name)) {
    return file.text();
  }

  const buffer = await file.arrayBuffer();

  if (name.endsWith(".pdf")) {
    await loadScript(LIBS.pdf);

    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    }

    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let output = "";

    for (
      let page = 1;
      page <= Math.min(pdf.numPages, 40) && output.length < MAX_PER_FILE;
      page++
    ) {
      const content = await (await pdf.getPage(page)).getTextContent();
      output += "\n--- стр. " + page + " ---\n" +
        content.items.map(item => item.str).join(" ");
    }

    return output.trim() || "(В PDF нет текстового слоя — возможно, это скан.)";
  }

  if (name.endsWith(".docx")) {
    await loadScript(LIBS.docx);
    return (await mammoth.extractRawText({ arrayBuffer: buffer })).value;
  }

  if (/\.xlsx?$/.test(name)) {
    await loadScript(LIBS.xlsx);
    const workbook = XLSX.read(buffer, { type: "array" });

    return workbook.SheetNames
      .map(sheet =>
        "## Лист: " + sheet + "\n" +
        XLSX.utils.sheet_to_csv(workbook.Sheets[sheet])
      )
      .join("\n\n");
  }

  if (name.endsWith(".pptx")) {
    await loadScript(LIBS.zip);
    const zip = await JSZip.loadAsync(buffer);
    const slides = Object.keys(zip.files)
      .filter(path => /^ppt\/slides\/slide\d+\.xml$/.test(path))
      .sort((a, b) =>
        Number(a.match(/\d+/)?.[0] || 0) -
        Number(b.match(/\d+/)?.[0] || 0)
      );

    let output = "";

    for (const [index, path] of slides.entries()) {
      const xml = await zip.files[path].async("string");
      const texts = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)]
        .map(match => match[1]);

      output += "\n--- слайд " + (index + 1) + " ---\n" +
        texts.join(" ");
    }

    return output.trim();
  }

  if (name.endsWith(".zip")) {
    await loadScript(LIBS.zip);
    const zip = await JSZip.loadAsync(buffer);
    const names = Object.keys(zip.files)
      .filter(path => !zip.files[path].dir);

    let output = "Файлы в архиве:\n" + names.slice(0, 200).join("\n");

    for (const path of names.filter(item => TEXT_RE.test(item)).slice(0, 15)) {
      output += "\n\n[" + path + "]\n" +
        (await zip.files[path].async("string")).slice(0, 4000);
    }

    return output;
  }

  throw new Error(
    "Формат файла не поддерживается. Старые .doc/.ppt сохраните как .docx/.pptx."
  );
}

async function prepareFiles(files) {
  const images = [];
  let extra = "";

  for (const file of files) {
    if (file.type.startsWith("image/")) {
      images.push(file);
      continue;
    }

    let content;

    try {
      content = (await extractFile(file)).slice(0, MAX_PER_FILE);
    } catch (error) {
      content = "(Не удалось прочитать файл: " + error.message + ")";
    }

    extra += (extra ? "\n\n" : "") +
      "[Файл " + file.name + "]\n" + content;

    if (extra.length > MAX_TOTAL) {
      extra = extra.slice(0, MAX_TOTAL) + "\n…(текст обрезан)";
      break;
    }
  }

  return { extra, images };
}

function getEndpoints(url) {
  if (url.endsWith("/chat/completions")) return [url];
  if (url.endsWith("/v1")) return [url + "/chat/completions"];

  return [
    url + "/v1/chat/completions",
    url + "/chat/completions"
  ];
}

function getHistory(chat) {
  return chat.messages
    .filter(message => !message.err && message.text)
    .slice(-20)
    .map(message => ({
      role: message.who === "ai" ? "assistant" : "user",
      content: message.text + (message.ctx ? "\n\n" + message.ctx : "")
    }));
}

function makeFullText(text, prepared) {
  return [text, prepared.extra].filter(Boolean).join("\n\n") ||
    "Посмотри вложения.";
}

async function askViaBackend(chat, text, prepared) {
  const form = new FormData();

  form.append("message", makeFullText(text, prepared));
  form.append("model", chat.name);
  form.append("api_key", chat.key);
  form.append("api_url", chat.url);
  form.append("history", JSON.stringify(getHistory(chat)));

  prepared.images.forEach(file => {
    form.append("files", file, file.name);
  });

  const response = await fetch(BACKEND + "/api/chat", {
    method: "POST",
    body: form
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(
      data.error || "Ошибка сервера (" + response.status + ")"
    );
    error.status = response.status;
    throw error;
  }

  return data.reply || "Пустой ответ.";
}

async function askDirect(chat, text, prepared) {
  const parts = [{
    type: "text",
    text: makeFullText(text, prepared)
  }];

  for (const image of prepared.images) {
    parts.push({
      type: "image_url",
      image_url: { url: await toDataURL(image) }
    });
  }

  const body = {
    model: chat.name,
    messages: [
      {
        role: "system",
        content: "Ты полезный ИИ-помощник. Отвечай на языке пользователя."
      },
      ...getHistory(chat),
      {
        role: "user",
        content: parts.length === 1 ? parts[0].text : parts
      }
    ]
  };

  let lastError = "";

  for (const endpoint of getEndpoints(chat.url)) {
    let response;

    try {
      if (PROXY) {
        response = await fetch(PROXY, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: endpoint,
            key: chat.key,
            body
          })
        });
      } else {
        response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + chat.key
          },
          body: JSON.stringify(body)
        });
      }
    } catch (_) {
      throw new Error(
        PROXY
          ? "Не удалось подключиться к Cloudflare Worker. Проверьте его адрес и настройки CORS."
          : "Не удалось подключиться к API. Проверьте адрес API и настройки CORS."
      );
    }

    if (response.status === 404 || response.status === 405) {
      lastError = "HTTP " + response.status;
      continue;
    }

    const responseText = await response.text();

    if (!response.ok) {
      throw new Error(
        "API вернул HTTP " + response.status + ": " +
        responseText.slice(0, 300)
      );
    }

    let data;
    try {
      data = JSON.parse(responseText);
    } catch (_) {
      throw new Error("API вернул ответ не в формате JSON. Проверьте адрес API.");
    }

    let answer = data.choices?.[0]?.message?.content;

    if (Array.isArray(answer)) {
      answer = answer.map(part => part.text || "").join("\n");
    }

    return answer || "Пустой ответ.";
  }

  throw new Error("Адрес API не найден (" + lastError + ").");
}

async function ask(chat, text, prepared) {
  const hostedOnPages =
    /github\.io$/i.test(location.hostname) ||
    location.protocol === "file:";

  if (BACKEND || !hostedOnPages) {
    try {
      return await askViaBackend(chat, text, prepared);
    } catch (error) {
      const mayFallback =
        error.status === 404 ||
        error.status === 405 ||
        error instanceof TypeError;

      if (!mayFallback) throw error;
    }
  }

  return askDirect(chat, text, prepared);
}

async function sendMessage() {
  const chat = active();
  const text = $("inp").value.trim();

  if (!chat || busy || (!text && !pending.length)) return;

  const files = pending.slice();

  busy = true;
  updateButtons();

  $("inp").value = "";
  $("inp").style.height = "auto";
  pending = [];
  renderPending();

  $("typing").classList.remove("hidden");

  try {
    const prepared = await prepareFiles(files);

    chat.messages.push({
      who: "user",
      text: text || "Посмотри вложения.",
      ctx: prepared.extra.slice(0, MAX_PER_FILE),
      files: files.map(file => ({
        name: file.name,
        type: file.type
      }))
    });

    save();
    renderMessages();
    renderList();

    const answer = await ask(chat, text, prepared);
    chat.messages.push({ who: "ai", text: answer });
  } catch (error) {
    chat.messages.push({
      who: "ai",
      err: true,
      text:
        "Не удалось получить ответ: " + error.message +
        "\nПроверьте адрес API, название модели и API-ключ."
    });
  } finally {
    busy = false;
    $("typing").classList.add("hidden");
    updateButtons();
    save();
    renderMessages();
    renderList();
  }
}

$("send").onclick = sendMessage;

$("inp").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("inp").addEventListener("input", () => {
  const input = $("inp");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

$("clearBtn").onclick = () => {
  const chat = active();

  if (!chat || busy) return;

  if (confirm("Очистить переписку?")) {
    chat.messages = [];
    save();
    renderMessages();
    renderList();
  }
};

$("form").addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
    $("side").classList.remove("open");
  }
});

load();
selectChat(activeId);
</script>
